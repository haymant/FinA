[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "fina-core"
version = "0.1.6"
description = "FinA (financial agent): native task pipeline Python library backed by a Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Traco Dev", email = "dev@lizhao.net" }]
keywords = ["etl", "json", "sonic-rs", "parquet", "rust", "financial", "scheduler", "pipeline"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.6,<2"]

[tool.maturin]
python-source = "python"
module-name = "fina_core._core"
features = ["pyo3/extension-module"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
