[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "fina-core"
version = "0.1.1"
description = "FinA (financial agent): native task pipeline Python library backed by a Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Traco Dev", email = "dev@lizhao.net" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Data Storage",
]
keywords = ["etl", "json", "sonic-rs", "parquet", "rust", "financial", "scheduler", "pipeline"]
dependencies = ["PyYAML>=6.0"]

[tool.maturin]
python-source = "python"
module-name = "fina_core._core"
features = ["pyo3/extension-module"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
