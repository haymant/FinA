[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "sonicetl"
version = "0.1.0"
description = "Native whole-ETL Python library backed by a Rust core (sonic-rs), with orjson-style JSON codecs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Traco Dev", email = "dev@lizhao.net" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Data Storage",
]
keywords = ["etl", "json", "sonic-rs", "parquet", "rust"]
dependencies = ["PyYAML>=6.0"]

[tool.maturin]
python-source = "python"
module-name = "sonicetl._core"
features = ["pyo3/extension-module"]
