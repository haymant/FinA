[package]
name = "fina"
version = "0.1.1"
edition = "2021"
description = "FinA (financial agent) core: Rust (pyo3 + sonic-rs) native whole-ETL engine exposed to Python"
license = "MIT"

[lib]
name = "fina"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39", "extension-module"] }
sonic-rs = "0.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
parquet = "59.2.0"
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
# NOTE: mimalloc was removed on purpose. Its `#[thread_local]` emitted
# initial-exec (R_X86_64_TPOFF64) relocations, forcing glibc to statically
# allocate the module's ~8.6 KB TLS block at dlopen and failing on stock glibc
# ("cannot allocate memory in static TLS block"). A wheel must have zero IE TLS
# relocs to import cleanly. See README "Known performance regression (TODO)"
# for the path back to a faster allocator.
duckdb = { version = "1.10505.0", features = ["bundled"] }
actix = "0.13"
actix-rt = "2"
serde_json = "1"
tokio = "1"

[profile.release]
lto = true
codegen-units = 1
